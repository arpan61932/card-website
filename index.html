<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Shop quality everyday tech and accessories at fair prices." />
  <title>ShopEasy</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="logo">ShopEasy</div>
    <nav class="nav">
      <a href="#products">Products</a>
      <a href="#cart">Cart</a>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero">
      <h1>Discover great deals</h1>
      <p>Quality products at fair prices. Free shipping over ₹999.</p>
      <a href="#products" class="btn">Shop now</a>
    </section>

    <section id="products" class="products-section">
      <h2>Featured products</h2>
      <div id="product-list" class="product-grid">
        <!-- Products will be injected by JS -->
      </div>
    </section>

    <section id="cart" class="cart-section">
      <h2>Your cart</h2>
      <div id="cart-items" class="cart-items"></div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span><span id="subtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Tax (18%)</span><span id="tax">₹0</span>
        </div>
        <div class="summary-row total">
          <span>Total</span><span id="total">₹0</span>
        </div>
        <button id="checkout-btn" class="btn primary">Checkout</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2025 ShopEasy • Meerut, UP</p>
  </footer>

</body>
</html>
